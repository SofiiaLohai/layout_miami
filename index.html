<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Miami</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="src/styles/main.css"
    />
    <script
      src="src/scripts/main.js"
      defer
    ></script>
  </head>
  <body>
    <header class="header" id="home">
      <nav class="navigation header__navigation">
        <a
          class="logo navigation__item"
          href="#home"
        >
          <img
            class="logo__icon"
            src="./src/images/logo.svg"
            alt="Logo"
          />
        </a>

        <div class="navigation__icons">
          <a
            class="phone navigation__item"
            href="#contact-us"
          >
            <span class="phone__label">Contact us</span>
            <img
              class="phone__icon"
              src="./src/images/Icon-Phone-call.svg"
              alt="Phone"
            />
          </a>

          <a
            class="burger navigation__item"
            href="#menu"
          >
            <span class="burger__label">Open menu</span>
            <!-- <img
              class="burger__icon"
              src="./src/images/Icon-Burger-menu.svg"
              alt="Logo"
            /> -->
          </a>
        </div>
      </nav>

      <h1 class="title header__title">
        Welcome
        <br />
        to The MET
      </h1>
    </header>

    <div
      class="menu"
      id="menu"
    >
      <nav class="navigation menu__navigation">
        <a
          class="logo navigation__item"
          href="#home"
        >
          <img
            class="logo__icon"
            src="./src/images/logo.svg"
            alt="Logo"
          />
        </a>

        <div class="navigation__icons">
          <a
            class="close navigation__item"
            href="#home"
          >
            <span class="close__label">Close menu</span>
            <img
              class="close__icon"
              src="./src/images/Icon-Close.svg"
              alt="Logo"
            />
          </a>
        </div>
      </nav>

      <nav class="links menu__links">
        <ul class="links__list">
          <li class="links__item">
            <a
              class="links__link"
              href="#home"
            >
              Home
            </a>
          </li>

          <li class="links__item">
            <a
              class="links__link"
              href="#about-us"
            >
              About Us
            </a>
          </li>

          <li class="links__item">
            <a
              class="links__link"
              href="#now-on-view"
            >
              Now on view
            </a>
          </li>

          <li class="links__item">
            <a
              class="links__link"
              href="#explore-online"
            >
              Explore Online
            </a>
          </li>

          <li class="links__item">
            <a
              class="links__link"
              href="#contact-us"
            >
              Contacts
            </a>
          </li>
        </ul>
      </nav>

      <div class="contacts menu__contacts">
        <div class="contacts__item">
          <p class="contacts__location">The Met Fifth Avenue</p>
          <a
            class="contacts__phone"
            href="tel:+1 212-535-7710"
          >
            +1 212-535-7710
          </a>
        </div>

        <div class="contacts__item">
          <p class="contacts__location">The Met Cloisters</p>
          <a
            class="contacts__phone"
            href="tel:+1 212-923-3700"
          >
            +1 212-923-3700
          </a>
        </div>
      </div>

      <a
        class="menu__call-link"
        href="#"
      >
        call to order
      </a>
    </div>
  </body>
</html>
